[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-token-stream-deflater"
version = "0.1.0"
description = "Streaming token dictionary compression and repetition pruning for real-time LLM-to-agent output pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-token-stream-deflater = "agent_token_stream_deflater.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_token_stream_deflater*"]
